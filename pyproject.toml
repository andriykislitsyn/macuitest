[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "macuitest"
version = "0.8.0"
description = "A simple UI testing framework for macOS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrii Kislitsyn", email = "andriikislitsyn@gmail.com" }]
keywords = ["macOS", "Testing", "E2E", "UI", "Automator", "Accessibility"]
classifiers = [
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Education :: Testing",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.13"
dependencies = [
    "opencv-python>=4.5.3",
    "pyobjc-framework-ApplicationServices>=7.3",
    "pyobjc-framework-Cocoa>=7.3",
    "pyobjc-framework-Quartz>=7.3",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3"]

[project.urls]
Homepage = "https://github.com/andriykislitsyn/macuitest"

[dependency-groups]
dev = ["pytesseract>=0.3", "pytest", "ruff", "ty"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
quote-style = "preserve"

[tool.ty.analysis]
# pyobjc resolves framework symbols lazily at runtime, so no static checker can see them.
replace-imports-with-any = [
    "AppKit",
    "ApplicationServices",
    "CoreFoundation",
    "Foundation",
    "Quartz",
    "Quartz.**",
    "objc",
]

# Files with pre-existing type errors. Remove an entry once its file type-checks.
[[tool.ty.overrides]]
include = [
    "src/macuitest/lib/applescript_lib/aeconverter.py",
    "src/macuitest/lib/applescript_lib/applescript_wrapper.py",
    "src/macuitest/lib/apps/browser.py",
    "src/macuitest/lib/elements/applescript_element.py",
    "src/macuitest/lib/elements/native/calls.py",
    "src/macuitest/lib/elements/native/converter.py",
    "src/macuitest/lib/operating_system/color_meter.py",
    "src/macuitest/lib/operating_system/db_manager.py",
    "src/macuitest/lib/operating_system/env.py",
    "src/macuitest/lib/operating_system/memory_manager.py",
    "src/macuitest/lib/operating_system/networking.py",
    "src/macuitest/lib/operating_system/service_manager.py",
    "src/macuitest/lib/operating_system/system_information.py",
    "src/macuitest/lib/operating_system/tcc.py",
    "src/macuitest/lib/operating_system/time_manager.py",
]
rules = { all = "ignore" }
