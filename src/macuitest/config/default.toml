# macuitest settings. Every key is optional, and an omitted key keeps the default shown here.
#
# macuitest reads the first of these it finds:
#   1. The file named by $MACUITEST_CONFIG.
#   2. macuitest.toml in the working directory.
#   3. pyproject.toml in the working directory, with each table below under [tool.macuitest],
#      such as [tool.macuitest.mouse].
#
# Code can still change any setting, such as settings.mouse.move = 0.36.

[mouse]
move = 0.18                # Seconds per cursor move.
hold = 0.24                # Seconds a button stays pressed during a click.
pause = 0.24               # Seconds to wait before a click.
default_position = [5, 3]  # Where Mouse.reset() parks the cursor, in points.

[keyboard]
pause = 0.001              # Seconds between key events while typing.

[screen]
# display = 1              # Search only this display, 0 being the menu bar one. Omit to search all.

[elements]
similarity = 0.925         # Minimum UIElement match score, from 0 to 1.
timeout = 5                # Seconds wait_displayed waits for an element to appear.
vanish_timeout = 15        # Seconds wait_vanish waits for an element to disappear.

[ocr]
languages = ["en-US"]      # Vision language codes TextElement reads, such as "uk-UA".

[paths]
# screenshots = "screenshots"  # ScreenshotPathBuilder root, relative to this file. $MACUITEST_SCR wins.
